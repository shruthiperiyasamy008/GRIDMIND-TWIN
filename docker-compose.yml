services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-wattwise}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-wattwise_dev_pw}
      POSTGRES_DB: ${POSTGRES_DB:-wattwise}
    ports: ["5432:5432"]
    volumes: [postgres_data:/var/lib/postgresql/data]
  backend:
    build: ./backend
    command: uvicorn app.main:app --host 0.0.0.0 --port 8000
    environment:
      POSTGRES_HOST: postgres
      POSTGRES_USER: ${POSTGRES_USER:-wattwise}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-wattwise_dev_pw}
      POSTGRES_DB: ${POSTGRES_DB:-wattwise}
    ports: ["8000:8000"]
    depends_on: [postgres]
  frontend:
    build: ./frontend
    environment: { NEXT_PUBLIC_API_URL: http://localhost:8000/api }
    ports: ["3000:3000"]
    depends_on: [backend]
volumes: { postgres_data: {} }
